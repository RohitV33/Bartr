version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bartr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bartr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bartrpass}
      POSTGRES_DB: ${POSTGRES_DB:-bartrdb}
    ports:
      - '${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bartr} -d ${POSTGRES_DB:-bartrdb}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bartr_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bartr_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@bartr.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '${PGADMIN_BIND_IP:-127.0.0.1}:${PGADMIN_PORT:-5050}:80'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

